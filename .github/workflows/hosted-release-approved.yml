name: Hosted Release (Explicit Approval)

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_release:
        description: Apply reviewed migrations and deploy this immutable image digest.
        type: boolean
        required: true
        default: false
      image_digest:
        description: Full Artifact Registry image reference ending in @sha256:<64 hex chars>.
        type: string
        required: true
      expected_project_ref:
        description: 20-character Supabase project ref shown in the production Environment.
        type: string
        required: true
      expected_migrations:
        description: Exact pending 14-digit migration versions, comma-separated, or none.
        type: string
        required: true
        default: none
      confirm_fresh_project_empty:
        description: Confirm in the Supabase Dashboard that a full-baseline target has no app schema/data.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm_hosted_release }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate immutable release input and reviewed migrations
        env:
          IMAGE: ${{ inputs.image_digest }}
          EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
          PROTECTED_PROJECT_REF: ${{ vars.ARVC_PRODUCTION_SUPABASE_PROJECT_REF }}
          CONFIRM_FRESH_PROJECT_EMPTY: ${{ inputs.confirm_fresh_project_empty }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          test "$EXPECTED_PROJECT_REF" = "$PROTECTED_PROJECT_REF"
          scripts/tests/check-forward-migrations.sh HEAD^
          scripts/tests/check-hosted-migration-manifest.sh
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Verify exact Hosted migration target
        env:
          SUPABASE_MIGRATION_DSN: ${{ secrets.SUPABASE_MIGRATION_DSN }}
          EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
          EXPECTED_POOLER_HOST: ${{ vars.ARVC_PRODUCTION_POOLER_HOST }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          CONFIRM_FRESH_PROJECT_EMPTY: ${{ inputs.confirm_fresh_project_empty }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_MIGRATION_DSN"
          python3 scripts/tests/check-hosted-migration-dsn.py
          list="$RUNNER_TEMP/arvc-migration-list.txt"
          dry="$RUNNER_TEMP/arvc-migration-dry-run.txt"
          if ! supabase migration list --db-url "$SUPABASE_MIGRATION_DSN" >"$list" 2>&1; then
            echo "Could not read Hosted migration history; no migration or deployment applied."
            exit 1
          fi
          if ! supabase db push --db-url "$SUPABASE_MIGRATION_DSN" --dry-run >"$dry" 2>&1; then
            echo "Hosted migration dry-run failed; no migration or deployment applied."
            exit 1
          fi
          python3 scripts/tests/check-hosted-migration-target.py before "$list" "$dry" "$EXPECTED_MIGRATIONS" "$CONFIRM_FRESH_PROJECT_EMPTY"
      - name: Apply only verified Hosted migrations
        env:
          SUPABASE_MIGRATION_DSN: ${{ secrets.SUPABASE_MIGRATION_DSN }}
        run: |
          set -euo pipefail
          if ! supabase db push --db-url "$SUPABASE_MIGRATION_DSN" --yes >"$RUNNER_TEMP/arvc-migration-apply.txt" 2>&1; then
            echo "Hosted migration apply failed. Automatic retry, history repair, rollback, and deployment are stopped."
            exit 1
          fi
          if ! supabase migration list --db-url "$SUPABASE_MIGRATION_DSN" >"$RUNNER_TEMP/arvc-migration-after.txt" 2>&1; then
            echo "Could not verify Hosted migration result; deployment is stopped."
            exit 1
          fi
          python3 scripts/tests/check-hosted-migration-target.py after "$RUNNER_TEMP/arvc-migration-after.txt" "$RUNNER_TEMP/arvc-migration-apply.txt" none false
      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.2.1
      - name: Deploy API and Worker by digest
        env:
          IMAGE: ${{ inputs.image_digest }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud run deploy arvc-audio-api --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --no-traffic
          gcloud run deploy arvc-audio-worker --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --no-traffic
          echo "Images deployed without traffic. Route traffic only after approved smoke checks and explicit operator action."
