name: Hosted Release (Explicit Approval)

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_release:
        description: Apply reviewed migrations and deploy this immutable image digest.
        type: boolean
        required: true
        default: false
      image_digest:
        description: Full Artifact Registry image reference ending in @sha256:<64 hex chars>.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    if: ${{ inputs.confirm_hosted_release }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate immutable release input and reviewed migrations
        env:
          IMAGE: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          scripts/tests/check-forward-migrations.sh HEAD^
          test -s supabase/migrations/20261105000100_step7k50b_audio_analysis_jobs.sql
          test -s supabase/migrations/20261105000200_step7k50d_audio_job_quota_idempotency.sql
          test -s supabase/migrations/20261105000300_step7k50e_audio_job_dispatch_outbox.sql
          test -s supabase/migrations/20261105000400_step7k52_audio_storage.sql
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Apply Hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.ARVC_PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked --yes
      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.2.1
      - name: Deploy API and Worker by digest
        env:
          IMAGE: ${{ inputs.image_digest }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud run deploy arvc-audio-api --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --no-traffic
          gcloud run deploy arvc-audio-worker --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --no-traffic
          echo "Images deployed without traffic. Route traffic only after approved smoke checks and explicit operator action."
