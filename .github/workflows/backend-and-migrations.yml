name: Backend and Database CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'supabase/**'
      - 'scripts/tests/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'api/**'
      - 'supabase/**'
      - 'scripts/tests/**'
      - 'Dockerfile'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go test -race ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify Hosted migration allowlist and target guards
        run: |
          scripts/tests/check-hosted-migration-manifest.sh
          scripts/tests/test-hosted-migration-guards.sh
      - name: Reject destructive changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/tests/check-forward-migrations.sh "$BASE_SHA"
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Apply new migration over sentinel user and quota data
        shell: bash
        run: |
          set -euo pipefail
          migration_queue=supabase/migrations/20261105000100_step7k50b_audio_analysis_jobs.sql
          migration_quota=supabase/migrations/20261105000200_step7k50d_audio_job_quota_idempotency.sql
          migration_dispatch=supabase/migrations/20261105000300_step7k50e_audio_job_dispatch_outbox.sql
          migration_storage=supabase/migrations/20261105000400_step7k52_audio_storage.sql
          temp_dir="$(mktemp -d)"
          mv "$migration_queue" "$temp_dir/queue.sql"
          mv "$migration_quota" "$temp_dir/job-quota.sql"
          mv "$migration_dispatch" "$temp_dir/job-dispatch.sql"
          mv "$migration_storage" "$temp_dir/job-storage.sql"
          restore_migration() {
            if [[ -f "$temp_dir/queue.sql" ]]; then mv "$temp_dir/queue.sql" "$migration_queue"; fi
            if [[ -f "$temp_dir/job-quota.sql" ]]; then mv "$temp_dir/job-quota.sql" "$migration_quota"; fi
            if [[ -f "$temp_dir/job-dispatch.sql" ]]; then mv "$temp_dir/job-dispatch.sql" "$migration_dispatch"; fi
            if [[ -f "$temp_dir/job-storage.sql" ]]; then mv "$temp_dir/job-storage.sql" "$migration_storage"; fi
            rm -rf "$temp_dir"
          }
          trap restore_migration EXIT
          supabase db start
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k50b-preservation-before.sql
          mv "$temp_dir/queue.sql" "$migration_queue"
          mv "$temp_dir/job-quota.sql" "$migration_quota"
          mv "$temp_dir/job-dispatch.sql" "$migration_dispatch"
          mv "$temp_dir/job-storage.sql" "$migration_storage"
          supabase migration up --local
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k50b-preservation-after.sql
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k50b-audio-analysis-jobs.sql
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k50d-audio-job-idempotency.sql
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k50e-audio-job-dispatch.sql
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k52-audio-storage.sql
          docker exec -i supabase_db_audio-reactive-visual-compiler psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < supabase/verification/step7k56-beta-entitlements.sql
          for invariant in \
            supabase/verification/step7b-privilege-invariants.sql \
            supabase/verification/step7g-ai-budget-privilege-invariants.sql \
            supabase/verification/step7k42-audio-analysis-privilege-invariants.sql; do
            output="$(docker exec -i supabase_db_audio-reactive-visual-compiler psql -XAt -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < "$invariant")"
            printf '%s\n' "$output"
            if grep -Eq '\|f(\||$)' <<<"$output"; then
              echo "Privilege invariant failed: $invariant" >&2
              exit 1
            fi
          done
          supabase db lint --local --fail-on error
          restore_migration
      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI is unavailable; no local Supabase stack was started."
          fi
