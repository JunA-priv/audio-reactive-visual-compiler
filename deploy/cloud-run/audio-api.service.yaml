# Template only. Render placeholders and review the protected production Environment
# before applying. Cloud Run remains private unless a separately reviewed gateway is used.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: arvc-audio-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 20
      timeoutSeconds: 780
      serviceAccountName: arvc-audio-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/arvc/api@sha256:REPLACE_WITH_VALIDATED_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - {name: PORT, value: "8080"}
            - {name: ARVC_SERVICE_ROLE, value: api}
            - {name: AUTH_ENV, value: hosted}
            - {name: PROJECTS_ENABLED, value: "false"}
            - {name: AI_GENERATION_ENABLED, value: "false"}
            - {name: AI_FIXTURE_UNLIMITED_LOCAL, value: "false"}
            - {name: AUDIO_ANALYSIS_ENABLED, value: "true"}
            - {name: AUDIO_ANALYSIS_JOBS_ENABLED, value: "true"}
            - {name: AUDIO_ANALYSIS_TRANSPORT, value: cloud_tasks}
            # Keep false until signed readiness approval and migration 050e apply.
            - {name: AUDIO_ANALYSIS_CLOUD_TASKS_ENABLED, value: "false"}
            - {name: AUDIO_ANALYSIS_THREADS, value: "1"}
            - {name: SUPABASE_URL, value: https://PROJECT_REF.supabase.co}
            - {name: CORS_ALLOWED_ORIGINS, value: https://APP_ORIGIN}
            - {name: AUDIO_WORKER_URL, value: https://WORKER_SERVICE_URL}
            - {name: AUDIO_API_URL, value: https://API_SERVICE_URL}
            # Enable only with the separate 8-hour DB probe Scheduler job and alert route.
            - {name: AUDIO_DB_HEALTHCHECK_ENABLED, value: "false"}
            - {name: CLOUD_DB_HEALTHCHECK_SERVICE_ACCOUNT, value: arvc-db-healthcheck@PROJECT_ID.iam.gserviceaccount.com}
            - {name: CLOUD_TASKS_PROJECT, value: PROJECT_ID}
            - {name: CLOUD_TASKS_LOCATION, value: REGION}
            - {name: CLOUD_TASKS_QUEUE, value: scnet-analysis}
            - {name: CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT, value: arvc-task-invoker@PROJECT_ID.iam.gserviceaccount.com}
            - {name: CLOUD_SCHEDULER_SERVICE_ACCOUNT, value: arvc-scheduler@PROJECT_ID.iam.gserviceaccount.com}
            - name: SUPABASE_AUDIO_ANALYSIS_DSN
              valueFrom: {secretKeyRef: {name: hosted-audio-worker-dsn, key: latest}}
            - name: SUPABASE_AUDIO_STORAGE_KEY
              valueFrom: {secretKeyRef: {name: hosted-audio-storage-key, key: latest}}
            - {name: SUPABASE_AUDIO_STORAGE_KEY_KIND, value: secret_api_key}
