<html lang="ja">

<body>
<header><div class="bar"><div><h1>アコースティック Kick 注釈</h1><span id="meta" class="subtle tiny">ローカル評価用。音声はこの端末から送信されません。</span></div><div class="row"><button id="play">再生</button><button id="playInterval">選択区間を再生</button><button id="pause">一時停止</button><button id="stop">停止</button><label><input id="loop" type="checkbox"> 区間をループ</label><span id="clock">0.000秒</span></div></div></header>
<main>
  <div class="panel"><div class="row"><button id="zoomOut">−</button><button id="zoomIn">＋</button><button id="zoomFit">全体表示</button><label>表示範囲 <input id="view" class="range" type="range" min="0" max="1000" value="0"></label><span id="viewLabel"></span><button id="addInterval">ドラッグ範囲を評価区間に追加</button></div><p class="subtle tiny">波形クリックでSeek、再生ヘッドのドラッグでSeek、Shift＋ドラッグで評価区間を指定します。候補一覧では短時間試聴とラベル切替ができます。</p><canvas id="wave" aria-label="音声波形とKick候補"></canvas></div>
  <div class="layout"><section>
    <div class="panel"><h2>選択中の候補 / ラベル</h2><div id="selectedInfo" class="subtle">波形上の候補を選択するか、現在位置にKickを追加してください。</div><div class="row"><label>時刻 ms <input id="labelTime" type="number" step="1"></label><label>状態 <select id="labelStatus"><option value="confirmed">Kick 確認</option><option value="rejected">Kickではない</option><option value="ambiguous">判定保留</option><option value="unverified">未確認</option></select></label><button id="applyLabel">適用</button><button id="addKick">現在位置にKickを追加</button></div><div class="row"><label>非Kickイベント <select id="negativeKind"><option value="snare">Snare</option><option value="tom">Tom</option><option value="bass">Bass</option><option value="other">その他</option><option value="unknown">不明</option></select></label><button id="addNegative">現在位置を非Kickとして記録</button><button id="deleteLabel">選択ラベルを削除</button></div></div>
    <div class="panel"><h2>候補 <span id="candidateCount"></span></h2><div class="row"><label>表示フィルター <select id="filter"><option value="all">すべて</option><option value="adopted">採用された候補</option><option value="excluded">除外された候補</option><option value="unreviewed">未確認</option></select></label><input id="search" type="search" placeholder="時刻で絞り込み (ms)"></div><div id="candidateList" class="candidate-list"></div></div>
  </section><aside>

    <div class="panel"><h2>保存と評価</h2><div class="row"><button class="primary" id="save">注釈を保存</button><button id="evaluate">完了区間を評価</button></div><div id="result" class="tiny"></div><p id="status" class="status" role="status"></p></div>
  </aside></div>
  <audio id="audio" preload="metadata"></audio>
</main>
<script type="module">

  $('addInterval').onclick=()=>{const start=Number($('intervalStart').value),end=Number($('intervalEnd').value);if(!(end>start)){say('波形をShift＋ドラッグして区間を選択してください。',true);return;}if(data.intervals.some(x=>start<x.endMs&&end>x.startMs)){say('既存の評価区間と重なっています。',true);return;}const it={id:crypto.randomUUID(),startMs:start,endMs:end,reviewStatus:'unreviewed',playedThrough:false,noKickConfirmed:false,notes:''};data.intervals.push(it);selectedInterval=it.id;renderIntervals();draw();};$('createInterval').onclick=$('addInterval').onclick;
  $('applyLabel').onclick=()=>{const time=Number($('labelTime').value),status=$('labelStatus').value;if(!Number.isInteger(time)||time<0||time>=session.durationMs){say('時刻は音源内の整数msで指定してください。',true);return;}if(selectedCandidate!==null){if(status==='confirmed'&&data.kickOnsets.some(x=>x.timeMs===time&&x.reviewStatus==='confirmed'&&x.candidateTimeMs!==undefined&&x.candidateTimeMs!==selectedCandidate)){say('同じ時刻のKickラベルが既にあります。',true);return;}setCandidateLabel(data,selectedCandidate,status,time);}else if(status==='confirmed'){if(data.kickOnsets.some(x=>x.timeMs===time&&x.reviewStatus==='confirmed')){say('同じ時刻のKickラベルが既にあります。',true);return;}const index=nearestCandidateIndex(session.candidates,time),nearby=index<0?null:session.candidates[index];if(nearby&&Math.abs(nearby.timeMs-time)<=80)setCandidateLabel(data,nearby.timeMs,'confirmed',time);else data.kickOnsets.push({timeMs:time,reviewStatus:'confirmed'});}else if(status==='ambiguous')data.ambiguousEvents.push({timeMs:time,reviewStatus:'ambiguous'});renderCandidates();draw();say('ラベルを更新しました。');};$('addKick').onclick=()=>{selectedCandidate=null;$('labelTime').value=Math.round(audio.currentTime*1000);$('labelStatus').value='confirmed';$('selectedInfo').textContent='新しいKickラベル';};$('addNegative').onclick=()=>{const time=Math.round(audio.currentTime*1000),kind=$('negativeKind').value;if(!data.negativeEvents.some(x=>x.timeMs===time&&x.kind===kind))data.negativeEvents.push({timeMs:time,kind,reviewStatus:'confirmed'});say('非Kickイベントを記録しました。');};$('deleteLabel').onclick=()=>{if(selectedCandidate!==null){data.candidateReviews=data.candidateReviews.filter(x=>x.candidateTimeMs!==selectedCandidate);data.kickOnsets=data.kickOnsets.filter(x=>x.candidateTimeMs!==selectedCandidate);data.ambiguousEvents=data.ambiguousEvents.filter(x=>x.candidateTimeMs!==selectedCandidate);}else{const time=Number($('labelTime').value);data.kickOnsets=data.kickOnsets.filter(x=>x.timeMs!==time);data.negativeEvents=data.negativeEvents.filter(x=>x.timeMs!==time);data.ambiguousEvents=data.ambiguousEvents.filter(x=>x.timeMs!==time);}renderCandidates();draw();};
  $('save').onclick=async()=>{try{await request('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:saveBody()});say('注釈を保存しました。');}catch(e){say(e.message,true);}};$('evaluate').onclick=async()=>{try{await request('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:saveBody()});const result=await request('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:saveBody()});$('result').textContent=JSON.stringify(result.aggregate,null,2);say('完了区間の評価が完了しました。');}catch(e){say(e.message,true);}};
  function setZoom(factor){const center=viewStart+viewDuration/2;viewDuration=Math.max(1000,Math.min(session.durationMs,viewDuration*factor));viewStart=Math.max(0,Math.min(session.durationMs-viewDuration,center-viewDuration/2));$('view').value=String(session.durationMs===viewDuration?0:viewStart/(session.durationMs-viewDuration)*1000);draw();}$('zoomIn').onclick=()=>setZoom(.7);$('zoomOut').onclick=()=>setZoom(1.4);$('zoomFit').onclick=()=>{viewStart=0;viewDuration=session.durationMs;draw();};$('view').oninput=()=>{viewStart=(session.durationMs-viewDuration)*Number($('view').value)/1000;draw();};canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(e.deltaY<0?.8:1.25);},{passive:false});$('filter').onchange=renderCandidates;$('search').oninput=renderCandidates;new ResizeObserver(resizeCanvas).observe(canvas);init().catch(e=>say(e.message,true));
})();
</script>
